<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B2A32" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="دفتر">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2A32; --ink-2:#4A606D; --ink-3:#7C929E;
  --bg:#EEF1F3; --surface:#FFFFFF; --line:#D6DEE3; --line-strong:#B9C6CE;
  --owed:#0B6E5F; --due:#A8412B; --accent:#1F5E8C; --accent-ink:#FFFFFF; --shade:#E3E9EC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E8EEF1; --ink-2:#A6B8C2; --ink-3:#748894;
    --bg:#121A1F; --surface:#1B252B; --line:#2C3A42; --line-strong:#3E4F59;
    --owed:#4FBFA8; --due:#E3806A; --accent:#5AA2D6; --accent-ink:#0E1518; --shade:#222E35;
  }
}
:root[data-theme="dark"]{
  --ink:#E8EEF1; --ink-2:#A6B8C2; --ink-3:#748894;
  --bg:#121A1F; --surface:#1B252B; --line:#2C3A42; --line-strong:#3E4F59;
  --owed:#4FBFA8; --due:#E3806A; --accent:#5AA2D6; --accent-ink:#0E1518; --shade:#222E35;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;
  font-size:16px;line-height:1.5;overscroll-behavior-y:none}
.num{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",sans-serif;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;direction:ltr;unicode-bidi:isolate}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
.topbar-row{display:flex;align-items:center;gap:6px;min-height:44px}
.topbar h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--ink-2);font-size:17px}
.iconbtn:active{background:var(--shade)}
.back{font-size:15px;font-weight:500;color:var(--accent);min-height:44px;display:flex;align-items:center;padding-inline:4px;flex:1}
main{flex:1;padding-bottom:104px}

.tabs{display:flex;gap:6px;margin-top:10px}
.tab{flex:1;min-height:42px;border-radius:9px;font-size:14.5px;font-weight:500;color:var(--ink-2);background:var(--shade)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.search{width:100%;min-height:46px;margin-top:10px;padding:0 14px;border:1px solid var(--line);
  border-radius:10px;background:var(--bg);font-size:16px}
.search::placeholder{color:var(--ink-3)}

.sumblock{background:var(--surface);border-bottom:1px solid var(--line)}
.sumrow{display:flex;align-items:stretch}
.sumrow+.sumrow{border-top:1px solid var(--line)}
.sumcur{width:58px;flex-shrink:0;display:grid;place-items:center;font-size:12.5px;font-weight:600;
  color:var(--ink-3);background:var(--shade)}
.sumrow>div.c{flex:1;padding:11px 14px 13px}
.sumrow>div.c+div.c{border-inline-start:1px solid var(--line)}
.sumrow span{display:block;font-size:12.5px;color:var(--ink-3);margin-bottom:2px}
.sumrow b{font-size:18px;font-weight:600;letter-spacing:-.02em}

.rows{background:var(--surface);border-bottom:1px solid var(--line)}
.sortbar{display:flex;align-items:center;gap:6px;padding:10px 14px 8px}
.sortbar span{font-size:12.5px;color:var(--ink-3);margin-inline-end:4px}
.sortbar button{min-height:34px;padding:0 13px;border-radius:17px;font-size:13px;font-weight:500;
  color:var(--ink-2);background:var(--shade)}
.sortbar button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.row{width:100%;display:flex;align-items:center;gap:12px;min-height:62px;padding:10px 14px;
  text-align:start;border-bottom:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 62px}
.row:last-child{border-bottom:none}
.row:active{background:var(--shade)}
.row-main{flex:1;min-width:0}
.row-name{font-size:16.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:13px;color:var(--ink-3);margin-top:1px}
.row-bal{text-align:end;flex-shrink:0}
.row-bal b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em}
.row-bal span{font-size:12px;color:var(--ink-3)}
.pos{color:var(--owed)} .neg{color:var(--due)} .zero{color:var(--ink-3)}
.more{width:100%;min-height:52px;font-size:15px;font-weight:500;color:var(--accent);
  background:var(--surface);border-bottom:1px solid var(--line)}
.count{padding:10px 14px;font-size:12.5px;color:var(--ink-3)}

.phead{background:var(--surface);border-bottom:1px solid var(--line);padding:16px 14px 18px}
.phead .name{font-size:20px;font-weight:600;letter-spacing:-.01em}
.phead .meta{font-size:13.5px;color:var(--ink-3);margin-top:2px}
.bigbal{display:flex;align-items:baseline;gap:8px;margin-top:14px;flex-wrap:wrap}
.bigbal b{font-size:37px;font-weight:600;line-height:1;letter-spacing:-.03em}
.bigbal em{font-style:normal;font-size:15px;font-weight:500;color:var(--ink-2)}
.phead-acts{display:flex;gap:8px;margin-top:16px}
.ghost{flex:1;min-height:44px;border:1px solid var(--line-strong);border-radius:9px;
  font-size:14.5px;font-weight:500;color:var(--ink-2);background:transparent}
.ghost:active{background:var(--shade)}

.entry{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface);
  border-inline-start:3px solid transparent;align-items:flex-start;
  content-visibility:auto;contain-intrinsic-size:auto 88px}
.entry.e-pos{border-inline-start-color:var(--owed)}
.entry.e-neg{border-inline-start-color:var(--due)}
.entry.e-void{opacity:.45;border-inline-start-color:var(--line-strong)}
.entry.e-void .e-desc,.entry.e-void .e-amt{text-decoration:line-through}
.e-main{flex:1;min-width:0}
.e-desc{font-size:15.5px;word-break:break-word;white-space:pre-wrap}
.e-meta{font-size:12.5px;color:var(--ink-3);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.e-fx{font-size:12.5px;color:var(--ink-2);margin-top:3px;background:var(--shade);
  display:inline-block;padding:2px 8px;border-radius:6px}
.e-right{text-align:end;flex-shrink:0}
.e-amt{font-size:16.5px;font-weight:600;letter-spacing:-.02em}
.e-run{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.e-tools{display:flex;gap:2px;margin-top:6px}
.e-tools button{font-size:13px;color:var(--accent);min-height:38px;padding-inline:10px;border-radius:7px;font-weight:500}
.e-tools button:active{background:var(--shade)}

.empty{padding:56px 28px;text-align:center;color:var(--ink-3);font-size:15px;line-height:1.7}

.syncbtn{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;border-radius:10px;
  font-size:12.5px;font-weight:500;color:var(--ink-3)}
.syncbtn:active{background:var(--shade)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink-3);flex-shrink:0}
.dot.ok{background:var(--owed)}
.dot.pend{background:#C98A22}
.dot.err{background:var(--due)}
.dot.busy{background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.toast{position:fixed;inset-inline:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:50;
  display:flex;justify-content:center;pointer-events:none}
.toast div{background:var(--ink);color:var(--surface);font-size:14px;font-weight:500;
  padding:11px 18px;border-radius:10px;max-width:92%;text-align:center}
.bottombar{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;gap:10px;max-width:560px;margin:0 auto}
.primary{flex:1;min-height:52px;border-radius:11px;background:var(--accent);color:var(--accent-ink);
  font-size:16.5px;font-weight:600}
.primary:active{filter:brightness(.92)}

.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(9,16,20,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:94dvh;overflow-y:auto;background:var(--surface);
  border-radius:16px 16px 0 0;padding:6px 14px calc(18px + env(safe-area-inset-bottom,0px));position:relative}
.sheetx{position:absolute;top:8px;inset-inline-end:8px;width:44px;height:44px;border-radius:10px;
  display:grid;place-items:center;font-size:20px;color:var(--ink-2);z-index:2}
.sheetx:active{background:var(--shade)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line-strong);margin:8px auto 14px}
.sheet h2{margin:0 0 16px;font-size:18px;font-weight:600}
.field{margin-bottom:16px}
.field label{display:block;font-size:14px;font-weight:500;color:var(--ink-2);margin-bottom:7px}
.field input,.field textarea{width:100%;min-height:52px;padding:13px 14px;border:1px solid var(--line-strong);
  border-radius:10px;background:var(--bg);font-size:17px}
.field textarea{resize:none;overflow:hidden;line-height:1.55;min-height:88px}
.amt-input{font-family:"IBM Plex Sans",sans-serif!important;font-variant-numeric:tabular-nums;
  font-size:26px!important;font-weight:600;letter-spacing:-.02em;direction:ltr;text-align:start}
.rate-input{font-family:"IBM Plex Sans",sans-serif!important;font-variant-numeric:tabular-nums;
  font-size:20px!important;font-weight:600;direction:ltr;text-align:start}
.picker{display:flex;gap:8px}
.picker button{flex:1;min-height:52px;border-radius:10px;border:1px solid var(--line-strong);
  font-size:15.5px;font-weight:500;color:var(--ink-2);background:var(--bg)}
.picker button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}
.picker button[disabled]{opacity:.4}
.two{display:flex;gap:10px}
.two>*{flex:1}
.hint{font-size:13px;color:var(--ink-3);margin-top:7px;line-height:1.6}
.conv{margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--shade);
  font-size:16px;font-weight:600;color:var(--ink)}
.conv small{display:block;font-size:12.5px;font-weight:400;color:var(--ink-3);margin-top:2px}
.calc{font-size:14.5px;color:var(--ink-2);margin-top:8px}
.amwords{font-size:14.5px;color:var(--ink-2);margin-top:7px;min-height:1.4em;line-height:1.5}

.stmt{background:var(--surface);padding:16px 14px 24px}
.stmt h2{margin:0;font-size:19px;font-weight:600}
.stmt .who{font-size:14px;color:var(--ink-3);margin-top:3px}
table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}
th{text-align:start;font-weight:600;color:var(--ink-2);font-size:12.5px;padding:8px 6px;border-bottom:1.5px solid var(--line-strong)}
td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{text-align:end;white-space:nowrap}
td small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
tr.v td{opacity:.45;text-decoration:line-through}
tfoot td{font-weight:700;font-size:15.5px;border-top:1.5px solid var(--line-strong);border-bottom:none;padding-top:12px}
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#000;--ink-2:#333;--ink-3:#666;--line:#ccc;--line-strong:#666}
  .topbar,.bottombar{display:none!important}
  main{padding-bottom:0}
}


/* ---------- اليومية والخزنة ---------- */
.blu{color:var(--accent)}
.entry.e-cash{border-inline-start-color:var(--accent)}
.navtabs .tab{font-size:14px}
.subtabs{margin-top:8px}
.subtabs .tab{min-height:38px;font-size:13.5px}
.gtot .sumrow b{font-size:16.5px}
.gtot .sumrow span{font-size:12px;line-height:1.35}
.sumrow>div.c{min-width:0}
.sumrow b{overflow-wrap:anywhere}
.actgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px}
.actgrid.a3{padding-top:4px}
.qbtn{min-height:58px;border-radius:11px;background:var(--surface);border:1.5px solid var(--line-strong);
  font-size:15.5px;font-weight:600;color:var(--ink)}
.qbtn:active{background:var(--shade)}
.q-cash,.q-recv{border-color:var(--owed);color:var(--owed)}
.q-pay,.q-buy,.q-exp{border-color:var(--due);color:var(--due)}
.q-credit{border-color:var(--accent);color:var(--accent)}
.notice{display:block;width:calc(100% - 28px);margin:12px 14px 0;padding:12px 14px;border-radius:10px;
  background:var(--shade);border:1.5px dashed var(--line-strong);font-size:14px;font-weight:500;color:var(--ink-2);text-align:start}
.notice-box{margin:0 14px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  font-size:14.5px;line-height:1.7;color:var(--ink-2)}
.daybar{display:flex;align-items:center;gap:6px;padding:4px 10px;background:var(--surface);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.daybar .iconbtn{font-size:26px;font-weight:600;color:var(--accent)}
.daymid{flex:1;display:flex;flex-direction:column;align-items:center}
.daymid input{min-height:40px;border:1px solid var(--line);border-radius:9px;background:var(--bg);
  padding:0 10px;font-size:16px;font-family:"IBM Plex Sans",sans-serif}
.daymid span{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.credline{padding:10px 14px 12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}
.credline b{color:var(--accent);font-weight:600}
.sechead.pad{margin:14px 14px 8px}
.hint.pad{margin:8px 14px 0}
.drow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-inline-end:14px}
.drow:last-child{border-bottom:none}
.drow-main{flex:1;min-width:0;text-align:start;padding:10px 14px;min-height:60px}
button.drow-main:active{background:var(--shade)}
.drow .row-bal b{font-size:16px}
.drow .row-bal b+b{margin-top:2px}
.drow.e-void{opacity:.45}
.drow.e-void .row-name,.drow.e-void .row-bal b{text-decoration:line-through}
.mini{font-size:12.5px;color:var(--accent);font-weight:500;min-height:34px;padding-inline:8px;border-radius:7px}
.mini:active{background:var(--shade)}
.row.pin{background:var(--shade)}
.plist{border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:52dvh;overflow-y:auto}
.vbig .sumrow b{font-size:24px}
.expgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
.expcard{background:var(--surface);border:1.5px solid var(--line-strong);border-radius:12px;padding:14px;text-align:start;min-height:112px}
.expcard span{display:block;font-size:14px;font-weight:600;color:var(--ink-2)}
.expcard b{display:block;font-size:24px;font-weight:600;margin-top:6px;letter-spacing:-.02em}
.expcard b.sm{font-size:17px;margin-top:2px}
.expcard em{display:block;font-style:normal;font-size:13px;color:var(--accent);margin-top:8px;font-weight:500}
/* ---------- receipts ---------- */
.ghost.side{flex:0 0 auto;min-height:52px;padding-inline:18px;border-radius:11px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;position:relative}
.item .field{margin-bottom:10px}
.item .field:last-child{margin-bottom:0}
.item-x{position:absolute;top:6px;inset-inline-end:6px;width:40px;height:40px;border-radius:9px;
  display:grid;place-items:center;color:var(--ink-3);font-size:17px}
.item-x:active{background:var(--shade)}
.item-num{font-size:12.5px;font-weight:600;color:var(--ink-3);margin-bottom:8px}
.item-sum{font-size:14px;color:var(--ink-2);text-align:end;margin-top:4px}
.edwrap{padding:14px}
.edwrap .field input,.edwrap .field textarea{background:var(--surface)}
.addline{width:100%;min-height:50px;border:1.5px dashed var(--line-strong);border-radius:12px;
  font-size:15px;font-weight:500;color:var(--accent);margin-bottom:18px}
.addline:active{background:var(--shade)}
.totalbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
.totalbox b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em}
.totalbox span{display:block;font-size:13.5px;color:var(--ink-2);margin-top:4px;line-height:1.6}
.sechead{font-size:14px;font-weight:600;color:var(--ink-2);margin:4px 2px 10px}

/* the receipt itself: always paper-white, in both themes */
.docwrap{padding:14px}
.doc{background:#fff;color:#111;border-radius:6px;padding:28px 22px 34px;
  box-shadow:0 1px 4px rgba(0,0,0,.12);font-size:14px;line-height:1.55}
.doc h1{margin:0 0 18px;text-align:center;font-size:26px;font-weight:700;letter-spacing:-.01em;
  padding-bottom:14px;border-bottom:2px solid #111}
.doc .meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;margin-bottom:6px}
.doc .meta b{font-weight:600}
.doc .to{font-size:15px;margin:10px 0 16px}
.doc .to b{font-weight:600}
.doc table{width:100%;border-collapse:collapse;margin:0;font-size:13.5px}
.doc th{background:#f1f3f4;color:#111;font-weight:600;font-size:12.5px;padding:8px 6px;
  border:1px solid #bbb;text-align:center}
.doc td{padding:8px 6px;border:1px solid #bbb;vertical-align:top;color:#111}
.doc td.c{text-align:center;white-space:nowrap}
.doc td.n{text-align:left;white-space:nowrap;direction:ltr}
.doc td.desc{white-space:pre-wrap;word-break:break-word}
.doc tfoot td{font-weight:700;font-size:14.5px;background:#f7f8f9}
.doc .words{margin-top:10px;font-size:14px;font-weight:600;padding:9px 10px;border:1px solid #bbb;background:#fafafa}
.doc .notes{margin-top:14px;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.doc .notes b{display:block;margin-bottom:2px}
.doc .signs{display:flex;gap:24px;margin-top:48px}
.doc .signs div{flex:1;border-top:1px solid #111;padding-top:6px;text-align:center;font-size:12.5px;color:#444}
.doc .scroll{overflow-x:auto}
@media print{
  @page{size:A4;margin:14mm}
  .docwrap{padding:0}
  .doc{box-shadow:none;border-radius:0;padding:0}
  .doc th,.doc tfoot td,.doc .words{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app"><div class="empty">…</div></div>
<div id="layer"></div>

<script>
"use strict";
const DBNAME="ledger_db", LSKEY="dgh_ledger_v1";
const TYPES={
  customer:{label:"زبائن",one:"زبون"},
  supplier:{label:"موردين",one:"مورّد"},
  worker:{label:"موظفين",one:"موظف"}
};
const KINDS={
  customer:[{id:"work",label:"عمل آجل",sign:1},{id:"cashwork",label:"عمل مباشر",sign:0},{id:"pay",label:"تسديد",sign:-1}],

/* ================= storage ================= */
function openIDB(){
  return new Promise((res,rej)=>{
    if(!("indexedDB" in window))return rej(new Error("no idb"));
    const r=indexedDB.open(DBNAME,2);
    r.onupgradeneeded=()=>{
      const d=r.result;
      if(!d.objectStoreNames.contains("parties"))d.createObjectStore("parties",{keyPath:"id"});
      if(!d.objectStoreNames.contains("entries"))d.createObjectStore("entries",{keyPath:"id"});
      if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta",{keyPath:"k"});
      if(!d.objectStoreNames.contains("receipts"))d.createObjectStore("receipts",{keyPath:"id"});
    };
    r.onsuccess=()=>{
      const db=r.result;
      /* لو انفتحت نسخة أحدث بمكان ثاني، هذي تسكر نفسها بدل ما تعلّقها */
      db.onversionchange=()=>{db.close();location.reload()};
      res(db);
    };
    r.onblocked=()=>{
      const a=document.getElementById("app");
      if(a)a.innerHTML=`<div class="empty">البرنامج مفتوح بمكان ثاني بنسخة قديمة.<br>
        سكّر كل نوافذ وتبويبات الدفتر، وافتحه مرة وحدة.</div>`;
    };
    r.onerror=()=>rej(r.error);
  });
}
function tx(s,m){return idb.transaction(s,m).objectStore(s)}
function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function put(store,obj){if(idb)await req(tx(store,"readwrite").put(obj));lsMirror()}
async function putMany(store,arr){
  if(!idb){lsMirror();return}
  const t=idb.transaction(store,"readwrite"),o=t.objectStore(store);
  arr.forEach(x=>o.put(x));
  await new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error)});
  lsMirror();
}
function lsMirror(){
  try{
    if(parties.length+entries.length>4000)return;
    localStorage.setItem(LSKEY,JSON.stringify({v:4,parties,entries,settings,receipts}));
  }catch(e){}
}
function readLS(){
  try{const r=localStorage.getItem(LSKEY);if(!r)return null;const p=JSON.parse(r);
      if(p&&Array.isArray(p.parties)&&Array.isArray(p.entries))return p;}catch(e){}
  return null;
}
function normalize(){
  for(const p of parties){ if(!p.cur)p.cur="IQD"; if(!p.updated)p.updated=Date.parse(p.created)||Date.now(); }
  for(const e of entries){ if(!e.updated)e.updated=Date.parse(e.created)||Date.now(); }
}
async function loadAll(){
  try{idb=await openIDB()}catch(e){idb=null;console.warn("IndexedDB unavailable",e)}
  if(idb){
    parties=await req(tx("parties","readonly").getAll());
    try{receipts=await req(tx("receipts","readonly").getAll())}catch(e){receipts=[]}
    entries=await req(tx("entries","readonly").getAll());
    const s=await req(tx("meta","readonly").get("settings"));
    if(s&&s.val)settings=Object.assign(settings,s.val);
    if(!parties.length&&!entries.length){
      const old=readLS();
      if(old&&(old.parties.length||old.entries.length)){
        parties=old.parties;entries=old.entries;
        if(old.settings)settings=Object.assign(settings,old.settings);
        normalize();
        await putMany("parties",parties);await putMany("entries",entries);await saveSettings();
      }
    }
  }else{
    const old=readLS();
    if(old){parties=old.parties;entries=old.entries;if(old.settings)settings=Object.assign(settings,old.settings)}
  }
  normalize();reindex();
}
async function saveSettings(){
  if(idb)await req(tx("meta","readwrite").put({k:"settings",val:settings}));
  lsMirror();
}

/* ================= index ================= */
const cmpEntry=(a,b)=>a.date===b.date?a.created.localeCompare(b.created):a.date.localeCompare(b.date);
const lastAct=new Map(); /* آخر وقت انسجلت بيه حركة لكل طرف — للترتيب حسب آخر حركة */
function bumpAct(e){const c=e.created||"";if(c>(lastAct.get(e.partyId)||""))lastAct.set(e.partyId,c)}
function reindex(){
  byParty.clear();bal.clear();lastAct.clear();
  for(const p of parties){byParty.set(p.id,[]);bal.set(p.id,0)}
  for(const e of entries){
    let a=byParty.get(e.partyId);
    if(!a){a=[];byParty.set(e.partyId,a);bal.set(e.partyId,0)}
    a.push(e);bal.set(e.partyId,bal.get(e.partyId)+e.sign*e.amount);bumpAct(e);
  }
  for(const a of byParty.values())a.sort(cmpEntry);
}
function addToIndex(e){
  let a=byParty.get(e.partyId);
  if(!a){a=[];byParty.set(e.partyId,a);bal.set(e.partyId,0)}
  a.push(e);a.sort(cmpEntry);
  bal.set(e.partyId,(bal.get(e.partyId)||0)+e.sign*e.amount);bumpAct(e);
}
const entriesOf=pid=>byParty.get(pid)||[];
const balanceOf=pid=>Math.round((bal.get(pid)||0)*100)/100;

/* ================= helpers ================= */
const nf0=new Intl.NumberFormat("en-US");
const nf2=new Intl.NumberFormat("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
function money(n,cur){return cur==="USD"?"$"+nf2.format(n):nf0.format(Math.round(n))}
function roundCur(n,cur){return cur==="USD"?Math.round(n*100)/100:Math.round(n)}
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dmy=iso=>{if(!iso)return"";const p=iso.split("-");return p[2]+"/"+p[1]+"/"+p[0]};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const appName=()=>settings.name&&settings.name.trim()?settings.name.trim():"دفتر";
const numOf=s=>{s=String(s==null?"":s)
  .replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d))
  .replace(/٫/g,".");return parseFloat(s.replace(/[^\d.]/g,""))||0};
const other=c=>c==="IQD"?"USD":"IQD";
function balWordShort(b){
  if(Math.abs(b)<0.005)return{cls:"zero",word:"مصفّر",n:0};
  if(b>0)return{cls:"pos",word:"عليه",n:b};
  return{cls:"neg",word:"له",n:-b};
}
function balWordLong(b,type){
  if(Math.abs(b)<0.005)return{cls:"zero",word:"الحساب مصفّر",n:0};
  if(b>0)return{cls:"pos",word:type==="worker"?"سحب زيادة":"عليه إلك",n:b};
  return{cls:"neg",word:"له عليك",n:-b};
}
function fxLine(e){
  if(!e.fx)return"";
  return `${money(e.fx.amount,e.fx.cur)} × ${nf0.format(e.fx.rate)}`;
}

function partyRows(){
  const q=view.q.trim();
  const list=[];
  for(const p of parties){
    if(p.type!==view.type)continue;
    if(q&&!(p.name.indexOf(q)>-1||(p.phone||"").indexOf(q)>-1))continue;
    list.push(p);
  }
  if(!list.length)
    return `<div class="empty">${q?"ماكو نتيجة تطابق البحث.":"القائمة فارغة.<br>أضف "+TYPES[view.type].one+" حتى تبدي التسجيل."}</div>`;
  if(settings.sort==="alpha")list.sort((a,b)=>a.name.localeCompare(b.name,"ar"));
  else list.sort((a,b)=>{
    const x=lastAct.get(b.id)||b.created||"",y=lastAct.get(a.id)||a.created||"";
    return x<y?-1:x>y?1:0;
  });
  const shown=list.slice(0,view.limit);
  let html=`<div class="rows">`+shown.map(p=>{
    const c=p.cur||"IQD",w=balWordShort(balanceOf(p.id)),n=entriesOf(p.id).length;
    const sub=[n+" حركة"];
    if(c==="USD")sub.push("حساب بالدولار");
    if(p.type==="worker"&&p.rate)sub.push(money(p.rate,c)+" للساعة");
    return `<button class="row" data-act="open" data-id="${p.id}">
      <div class="row-main">
        <div class="row-name">${esc(p.name)}</div>
        <div class="row-sub">${sub.join(" · ")}</div>
      </div>
      <div class="row-bal"><b class="num ${w.cls}">${money(w.n,c)}</b><span>${w.word}</span></div>
    </button>`}).join("")+`</div>`;
  if(list.length>shown.length)
    html+=`<button class="more" data-act="more">عرض ${Math.min(PAGE,list.length-shown.length)} إضافيين — الباقي ${list.length-shown.length}</button>`;
  else html+=`<div class="count">${list.length} ${TYPES[view.type].label}</div>`;
  return html;
}

  return `<div class="entry ${cls}">
    <div class="e-main">
      <div class="e-desc">${esc(e.desc||KLABEL[e.kind]||"")}</div>

      <div class="e-amt num ${e.sign>0?"pos":e.sign<0?"neg":"blu"}">${e.sign>0?"+":e.sign<0?"−":""}${money(e.amount,c)}</div>
      <div class="e-run num">${money(rw.n,c)} ${rw.word}</div>
    </div>
  </div>`;
}

/* ================= أطراف النظام والخزنة ================= */
async function sysParty(id){
  let p=parties.find(x=>x.id===id);
  if(p)return p;
  const d=SYSDEF[id];
  p={id,type:d.type,name:d.name,phone:"",cur:"IQD",rate:0,created:new Date().toISOString(),
     updated:1,synced:false};
  parties.push(p);byParty.set(id,[]);bal.set(id,0);
  await put("parties",p);
  return p;
}
const isLive=e=>!e.voided&&e.kind!=="void";
const cashOf=e=>e.fx?{cur:e.fx.cur,amt:e.fx.amount}:{cur:e.cur,amt:e.amount};
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const monthName=ym=>{const [y,m]=ym.split("-");return MONTHS[+m-1]+" "+y};
function pMap(){return new Map(parties.map(p=>[p.id,p]))}

/* شغل الورشة الفعلي اللي يحرك الكاش: استلام، تسديد، عمل مباشر، مصروف.
   التصريف والتحويل والجرد والافتتاحي حركات داخلية — ما تنحسب دخل ولا مصروف. */
function flowOf(e,p){
  if(!isLive(e))return[];
  const t=p?p.type:"";
  if(e.kind==="pay"){
    const a=cashOf(e);
    if(t==="customer")return[[a.cur,a.amt]];
    if(t==="supplier"||t==="worker")return[[a.cur,-a.amt]];
    return[];
  }
  if(e.kind==="cashwork"){const a=cashOf(e);return[[a.cur,a.amt]]}
  if(e.kind==="exp")return[[e.cur,-e.amount]];
  return[];
}
/* كل أثر حركة على الخزنة العامة: [[العملة، المبلغ]] */
function mainFx(e,p){
  if(!isLive(e))return[];
  if(e.partyId===SYS.vault){
    if(e.kind==="open")return[[e.cur,e.amount]];
    if(e.kind==="adj")return[[e.cur,e.sign*e.amount]];
    if(e.kind==="fxx"&&e.fx)return[[e.cur,-e.amount],[e.fx.cur,e.fx.amount]];
    return[];
  }
  if(e.partyId===SYS.save)return e.kind==="xfer"?[[e.cur,-e.sign*e.amount]]:[];
  return flowOf(e,p);
}
function saveFx(e){
  if(!isLive(e)||e.partyId!==SYS.save)return[];
  if(e.kind==="open")return[[e.cur,e.amount]];
  if(e.kind==="adj"||e.kind==="xfer")return[[e.cur,e.sign*e.amount]];
  return[];
}
/* يوم التشغيل = تاريخ الرصيد الافتتاحي. ينحفظ كحركة، فكل الأجهزة تحسب من نفس اليوم */
function vaultStart(){
  let s=null;
  for(const e of entriesOf(SYS.vault))if(isLive(e)&&e.kind==="open"&&(!s||e.date<s))s=e.date;
  return s;
}
function vaultBal(upto){
  const st=vaultStart();if(!st)return null;
  const pm=pMap(),b={IQD:0,USD:0};
  for(const e of entries){
    if(e.date<st||(upto&&e.date>upto))continue;
    for(const [c,v] of mainFx(e,pm.get(e.partyId)))b[c]+=v;
  }
  b.IQD=roundCur(b.IQD,"IQD");b.USD=roundCur(b.USD,"USD");
  return b;
}
function saveBal(){
  const b={IQD:0,USD:0};
  for(const e of entriesOf(SYS.save))for(const [c,v] of saveFx(e))b[c]+=v;
  b.IQD=roundCur(b.IQD,"IQD");b.USD=roundCur(b.USD,"USD");
  return b;
}
function globalTotals(){
  const t={IQD:{g:0,r:0,any:false},USD:{g:0,r:0,any:false}};
  for(const p of parties){
    if(p.type!=="customer"&&p.type!=="supplier")continue;
    const c=p.cur||"IQD",b=balanceOf(p.id);
    t[c].any=true;
    if(p.type==="customer"&&b>0)t[c].g+=b;
    if(b<0)t[c].r+=-b;
  }
  return t;
}
function kindLabel(e,p){
  if(e.kind==="pay"){
    if(p&&p.type==="customer")return"استلام";
    if(p&&p.type==="worker")return"دفعة موظف";
    return"تسديد";
  }
  if(e.kind==="exp")return p&&p.id===SYS.expHome?"مصروف البيت":"مصروف الشغل";
  if(e.kind==="xfer")return e.sign>0?"تحويل للتوفير":"تحويل من التوفير";
  if(e.kind==="work")return"عمل آجل";
  return KLABEL[e.kind]||e.kind;
}

  return `
  <div class="topbar">${topRow()}</div>
  <main>
    <div class="sumblock gtot">${head}</div>
    ${vb?"":`<button class="notice" data-act="nav" data-v="vault">الخزنة ما اشتغلت بعد — دوس هنا وسجّل الرصيد الافتتاحي</button>`}

      <button class="iconbtn" data-act="day" data-d="-1" aria-label="اليوم السابق">›</button>
      <div class="daymid">

      </div>
      <button class="iconbtn" data-act="day" data-d="1" aria-label="اليوم التالي">‹</button>
    </div>

      <div class="credline" data-t="cred">آجل انسجل هذا اليوم (دين، مو كاش): ${credLine0||`<b class="num">0</b>`}</div>
    </div>
    <div class="sechead pad">حركات ${isToday?"اليوم":dmy(d)} — ${day.length}</div>
    ${day.length?`<div class="rows">${day.map(e=>dayRow(e,pm.get(e.partyId))).join("")}</div>`
      :`<div class="empty">ماكو حركات بهذا اليوم.</div>`}

function dayName(iso){
  try{return new Date(iso+"T12:00:00").toLocaleDateString("ar-IQ",{weekday:"long"})}catch(e){return""}
}
function dayRow(e,p,o){
  o=o||{};
  const voided=!!e.voided;
  const fx=mainFx(Object.assign({},e,{voided:false}),p);
  let amt;
  if(e.kind==="fxx"&&e.fx)amt=`<b class="num neg">−${money(e.amount,e.cur)}</b><b class="num pos">+${money(e.fx.amount,e.fx.cur)}</b>`;
  else if(fx.length){const [c,v]=fx[0];amt=`<b class="num ${v>0?"pos":"neg"}">${v>0?"+":"−"}${money(Math.abs(v),c)}</b>`}
  else if(e.partyId===SYS.save&&e.kind!=="xfer"){amt=`<b class="num blu">${e.sign<0?"−":"+"}${money(e.amount,e.cur)}</b>`}
  else amt=`<b class="num zero">${money(e.amount,e.cur)}</b><span>${e.kind==="work"?"دين":"بلا كاش"}</span>`;
  const openable=p&&(TYPES[p.type]||p.type==="walkin");
  const note=e.desc&&e.desc!==KLABEL[e.kind]&&e.desc!=="مصروف"?e.desc:"";
  const title=o.noteAsName&&note?note:(p?p.name:"؟");
  const sub=[];
  if(o.date)sub.push(dmy(e.date));
  sub.push(kindLabel(e,p));
  if(e.fx&&e.kind!=="fxx")sub.push(fxLine(e));
  if(note&&!o.noteAsName)sub.push(note);
  return `<div class="drow ${voided?"e-void":""}">
    <${openable?`button data-act="open" data-id="${p.id}"`:"div"} class="drow-main">
      <div class="row-name">${esc(title)}</div>
      <div class="row-sub">${esc(sub.join(" · "))}</div>
    </${openable?"button":"div"}>
    <div class="row-bal">${amt}
      ${!voided&&!openable?`<button class="mini" data-act="void" data-id="${e.id}">إلغاء</button>`:""}</div>
  </div>`;
}

function pickParty(o,cb){

function wireAmt(id,curFn){

/* ================= live amount input ================= */
/* فارزة كل ثلاث أرقام وإنت تكتب، والمؤشر يبقى بمكانه */
function grp(v){
  const s=String(v==null?"":v);if(s==="")return"";
  const [i,d]=s.split(".");
  const g=String(i).replace(/\B(?=(\d{3})+(?!\d))/g,",");
  return d!==undefined?g+"."+d:g;
}
function liveGroup(el){
  if(!el||el._lg)return;el._lg=1;
  const norm=t=>t.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))
    .replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/٫/g,".");
  const fix=()=>{
    const v=el.value,caret=el.selectionStart==null?v.length:el.selectionStart;
    const before=norm(v.slice(0,caret)).replace(/[^\d.]/g,"").length;
    let raw=norm(v).replace(/[^\d.]/g,"");
    const dot=raw.indexOf(".");
    let int=dot>-1?raw.slice(0,dot):raw;
    const dec=dot>-1?raw.slice(dot+1).replace(/\./g,""):null;
    int=int.replace(/^0+(?=\d)/,"");
    const out=grp(int)+(dec!==null?"."+dec:"");
    if(out===v)return;
    el.value=out;
    let seen=0,pos=0;
    while(pos<out.length&&seen<before){if(/[\d.]/.test(out[pos]))seen++;pos++}
    try{el.setSelectionRange(pos,pos)}catch(e){}
  };
  el.addEventListener("input",fix);
  fix();
}
/* المبلغ بالحروف تحت الحقل — يكشف الصفر الزايد فوراً */
function liveWords(v,cur){
  v=Math.round(Math.abs(v)*100)/100;if(!v)return"";
  if(cur==="USD"){const d=Math.floor(v),c=Math.round((v-d)*100);
    return (d?tafqeetInt(d)+" دولار":"")+(c?(d?" و":"")+tafqeetInt(c)+" سنت":"")}
  return tafqeetInt(Math.round(v))+" دينار";
}

/* ================= receipts (مستقلة عن الحسابات) ================= */
function tafqeetInt(n){
  n=Math.floor(Math.abs(n));
  if(n===0)return"صفر";
  const ones=["","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة"];
  const teens=["عشرة","أحد عشر","اثنا عشر","ثلاثة عشر","أربعة عشر","خمسة عشر","ستة عشر","سبعة عشر","ثمانية عشر","تسعة عشر"];
  const tens=["","","عشرون","ثلاثون","أربعون","خمسون","ستون","سبعون","ثمانون","تسعون"];
  const hund=["","مائة","مائتان","ثلاثمائة","أربعمائة","خمسمائة","ستمائة","سبعمائة","ثمانمائة","تسعمائة"];
  function under1000(x){
    const h=Math.floor(x/100),r=x%100,parts=[];
    if(h)parts.push(hund[h]);
    if(r){
      if(r<10)parts.push(ones[r]);
      else if(r<20)parts.push(teens[r-10]);
      else{const o=r%10,t=Math.floor(r/10);parts.push(o?ones[o]+" و"+tens[t]:tens[t])}
    }
    return parts.join(" و");
  }
  const scales=[null,["ألف","ألفان","آلاف"],["مليون","مليونان","ملايين"],["مليار","ملياران","مليارات"]];
  const groups=[];let x=n;while(x>0){groups.push(x%1000);x=Math.floor(x/1000)}
  const out=[];
  for(let i=groups.length-1;i>=0;i--){
    const g=groups[i];if(!g)continue;
    if(i===0){out.push(under1000(g));continue}
    const s=scales[i];
    if(g===1)out.push(s[0]);
    else if(g===2)out.push(s[1]);
    else if(g<=10)out.push(under1000(g)+" "+s[2]);
    else out.push(under1000(g)+" "+s[0]);
  }
  return out.join(" و");
}
function amountWords(v,cur){
  v=Math.round(Math.abs(v)*100)/100;
  if(cur==="USD"){
    const d=Math.floor(v),c=Math.round((v-d)*100);
    let s="فقط "+tafqeetInt(d)+" دولار أمريكي";
    if(c)s+=" و"+tafqeetInt(c)+" سنت";
    return s+" لا غير";
  }
  return "فقط "+tafqeetInt(Math.round(v))+" دينار عراقي لا غير";
}
function nextRef(prev){
  prev=String(prev||"").trim();
  if(!prev)return"0001";
  const m=prev.match(/^(.*?)(\d+)(\D*)$/);
  if(!m)return prev+"-2";
  return m[1]+String(Number(m[2])+1).padStart(m[2].length,"0")+m[3];
}
/* آخر رقم = رقم آخر إيصال انشأ (مو آخر واحد انعدل)، حتى تعديل إيصال قديم ما يرجّع العداد */
function lastRef(){
  let best=null;
  for(const r of receipts)if(!best||r.created>best.created)best=r;
  return best?best.no:(settings.lastRef||"");
}
const nfq=new Intl.NumberFormat("en-US",{maximumFractionDigits:3});
function rTotal(r){return roundCur(r.items.reduce((s,it)=>s+roundCur(numOf(it.q)*numOf(it.p),r.cur),0),r.cur)}

function bindEditor(){
  const d=draft;if(!d)return;
  const on=(id,f)=>{const el=document.getElementById(id);
    if(el)el.addEventListener("input",()=>{f(el.value);draftDirty=true})};
  on("r-no",v=>d.no=v);on("r-dt",v=>d.date=v);on("r-to",v=>d.to=v);
  const nt=document.getElementById("r-notes");
  nt.addEventListener("input",()=>{d.notes=nt.value;draftDirty=true;autogrow(nt)});autogrow(nt);
  document.querySelectorAll("#r-cur button").forEach(b=>b.onclick=()=>{
    d.cur=b.dataset.c;draftDirty=true;
    document.querySelectorAll("#r-cur button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.c===d.cur));
    paintTotals();
  });
  document.querySelectorAll("#r-items .item").forEach(card=>{
    const it=d.items[+card.dataset.i];
    const ta=card.querySelector(".it-d"),q=card.querySelector(".it-q"),p=card.querySelector(".it-p");
    const grow=()=>{ta.style.height="auto";ta.style.height=Math.max(56,ta.scrollHeight)+"px"};
    ta.addEventListener("input",()=>{it.d=ta.value;draftDirty=true;grow()});grow();
    q.addEventListener("input",()=>{it.q=q.value;draftDirty=true;paintTotals()});
    p.addEventListener("input",()=>{it.p=p.value;draftDirty=true;paintTotals()});
    liveGroup(p);
  });
  paintTotals();
}
function paintTotals(){
  const d=draft;if(!d)return;
  let tot=0;
  document.querySelectorAll("#r-items .item").forEach(card=>{
    const it=d.items[+card.dataset.i];
    const line=roundCur(numOf(it.q)*numOf(it.p),d.cur);tot+=line;
    card.querySelector(".it-s").textContent=line?nfq.format(numOf(it.q))+" × "+money(numOf(it.p),d.cur)+" = "+money(line,d.cur):"";
  });
  tot=roundCur(tot,d.cur);
  document.getElementById("r-total").textContent=money(tot,d.cur);
  document.getElementById("r-words").textContent=tot?amountWords(tot,d.cur):"";
}

async function rSave(){
  const d=draft;if(!d)return;
  d.no=String(d.no||"").trim();
  if(!d.no){alert("اكتب الرقم المرجعي.");return}
  const items=d.items.filter(it=>String(it.d||"").trim()||numOf(it.p));
  if(!items.length){alert("اكتب بند واحد على الأقل.");return}
  const dup=receipts.find(r=>r.no===d.no&&r.id!==d.id);
  if(dup&&!confirm("الرقم "+d.no+" مستخدم بإيصال ثاني ("+(dup.to||"بدون اسم")+"). تحفظ بنفس الرقم؟"))return;
  const now=new Date().toISOString(),isNew=!d.id;
  const rec={id:d.id||uid(),no:d.no,date:d.date||today(),to:String(d.to||"").trim(),cur:d.cur,
    items:items.map(it=>({d:String(it.d||"").trim(),q:String(it.q||"").trim()||"1",p:String(it.p||"").trim()})),
    notes:String(d.notes||"").trim(),created:d.created||now,updated:now};
  const i=receipts.findIndex(r=>r.id===rec.id);
  if(i>-1)receipts[i]=rec;else receipts.push(rec);
  await put("receipts",rec);
  if(isNew){settings.lastRef=rec.no;await saveSettings()}
  draft=null;draftDirty=false;
  view.name="rview";view.rid=rec.id;history.replaceState(navState(),"");
  render();window.scrollTo(0,0);
}
async function rDel(id){
  const r=receipts.find(x=>x.id===id);if(!r)return;
  if(!confirm("تحذف الإيصال "+r.no+"؟ الحذف نهائي."))return;
  receipts=receipts.filter(x=>x.id!==id);
  if(idb)await req(tx("receipts","readwrite").delete(id));
  lsMirror();goBack();
}

function rDocView(){
  const r=receipts.find(x=>x.id===view.rid);
  if(!r){view.name="rlist";return rListView()}
  const c=r.cur;
  const rows=r.items.map((it,i)=>{
    const q=numOf(it.q),p=numOf(it.p),line=roundCur(q*p,c);
    return `<tr><td class="c num">${i+1}</td><td class="desc">${esc(it.d)}</td>
      <td class="c num">${nfq.format(q)}</td><td class="n">${money(p,c)}</td><td class="n">${money(line,c)}</td></tr>`;
  }).join("");
  const total=rTotal(r);
  return `
  <div class="topbar"><div class="topbar-row">
    <button class="back" data-act="back">‹ رجوع</button>
    <button class="back" style="flex:0 0 auto;color:var(--due)" data-act="rdel" data-id="${r.id}">حذف</button>
  </div></div>
  <main><div class="docwrap"><div class="doc">
    <h1>ايصال عمل</h1>
    <div class="meta">
      <div>رقم مرجعي: <b class="num">${esc(r.no)}</b></div>
      <div>التاريخ: <b class="num">${dmy(r.date)}</b></div>
    </div>
    <div class="to">السادة / <b>${esc(r.to||"—")}</b></div>
    <div class="scroll"><table>
      <thead><tr><th style="width:34px">ت</th><th>البيان</th><th style="width:62px">الكمية</th>
        <th style="width:100px">السعر</th><th style="width:110px">المبلغ</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td colspan="4">المجموع الكلي</td><td class="n">${money(total,c)}</td></tr></tfoot>
    </table></div>
    <div class="words">${amountWords(total,c)}</div>
    ${r.notes?`<div class="notes"><b>ملاحظات:</b>${esc(r.notes)}</div>`:""}
    <div class="signs"><div>توقيع المنفّذ</div><div>توقيع المستلم</div></div>
  </div></div></main>
  <div class="bottombar">
    <button class="ghost side" data-act="rdup" data-id="${r.id}">نسخ</button>
    <button class="ghost side" data-act="redit" data-id="${r.id}">تعديل</button>
    <button class="primary" data-act="print">طباعة / PDF</button>
  </div>`;
}

/* ================= navigation ================= */
/* كل شاشة تنضاف لسجل المتصفح، حتى إيماءة الرجوع بالتلفون ترجع شاشة وحدة
   بدل ما تطلع من البرنامج كامل. */
function navState(){return{name:view.name,partyId:view.partyId,type:view.type,rid:view.rid,day:view.day,top:view.top}}
function toBottom(){
  const f=()=>window.scrollTo(0,document.documentElement.scrollHeight);
  f();requestAnimationFrame(f);setTimeout(f,60);   /* مرتين حتى تستقر أطوال السطور */
}
function land(){view.name==="party"?toBottom():window.scrollTo(0,0)}
function go(st){
  view.name=st.name;if(st.partyId)view.partyId=st.partyId;if(st.rid)view.rid=st.rid;
  history.pushState(navState(),"");
  render();land();
}
function goBack(){
  if(history.state&&history.state.name&&TOP.indexOf(history.state.name)<0)history.back();
  else{view.name=view.top||"journal";history.replaceState(navState(),"");render()}
}
window.addEventListener("popstate",ev=>{
  /* نافذة إدخال مفتوحة: الإيماءة ما تسكرها — تبقى لحد ما تدوس X */
  if(document.querySelector("#layer .sheet-bg")){history.pushState(navState(),"");return}
  /* إيصال ما انحفظ: الرجوع يسأل قبل ما يضيع الشغل */
  if(view.name==="redit"&&draftDirty){
    history.pushState(navState(),"");
    if(confirm("الإيصال ما انحفظ. تطلع وتخسر اللي كتبته؟")){draftDirty=false;draft=null;history.back()}
    return;
  }
  const st=ev.state||{name:"journal"};
  view.name=st.name||"journal";
  if(st.top)view.top=st.top;
  view.day=st.day||null;
  if(st.partyId)view.partyId=st.partyId;
  if(st.type)view.type=st.type;
  if(st.rid)view.rid=st.rid;
  render();land();
});

/* ================= sync ================= */

/* ---- customer link ---- */
function randSlug(){
  var s="",abc="abcdefghijkmnpqrstuvwxyz23456789";
  if(window.crypto&&crypto.getRandomValues){
    var a=new Uint8Array(18);crypto.getRandomValues(a);
    for(var i=0;i<18;i++)s+=abc[a[i]%abc.length];
  }else{for(var j=0;j<18;j++)s+=abc[Math.floor(Math.random()*abc.length)]}
  return s;
}
function waNumber(phone){
  var d=String(phone||"").replace(/\D/g,"");
  if(!d)return"";
  if(d.indexOf("00")===0)d=d.slice(2);
  if(d.indexOf("964")===0)return d;
  if(d.indexOf("0")===0)d=d.slice(1);
  if(d.length===10&&d.indexOf("7")===0)return"964"+d;
  return d.length>=9?"964"+d:"";
}
async function shareSheet(pid){
  const p=parties.find(x=>x.id===pid);
  if(!p)return;
  if(!settings.syncUrl){
    openSheet(`<div class="grab"></div><h2>رابط الزبون</h2>
      <div class="hint" style="margin-bottom:16px">الرابط يقرا من كوكل شيت، فلازم تربط المزامنة أول.
      افتح الإعدادات وحط رابط المزامنة والرمز.</div>
      <button class="primary" id="ok">تمام</button>`);
    document.getElementById("ok").onclick=closeSheet;return;
  }
  let fresh=false;
  if(!p.pub){p.pub=randSlug();p.updated=Date.now();p.synced=false;await put("parties",p);fresh=true}
  const link=settings.syncUrl+"?s="+p.pub;
  const wa=waNumber(p.phone);
  const txt="كشف حسابك مع "+(settings.name||"الورشة")+":\n"+link;

  openSheet(`<div class="grab"></div>
    <h2>رابط حساب ${esc(p.name)}</h2>
    <div class="hint" style="margin:-8px 0 14px">صفحة عربية تتحدث لحالها كل ما تسجل حركة.
      أي واحد يوصله الرابط يشوفها، فما تنرسل إلا للزبون نفسه.</div>
    <div class="field"><textarea id="lk" readonly
      style="min-height:78px;font-size:12px;direction:ltr;text-align:left">${esc(link)}</textarea></div>
    <div id="warn">${!p.synced?`<div class="conv" style="margin-bottom:14px">الرابط ما اشتغل بعد
      <small>لازم يوصل الشيت أول — دوس «فعّل الرابط» تحت</small></div>`:""}</div>
    <div class="two" style="margin-bottom:10px">
      <button class="ghost" id="cp">نسخ الرابط</button>
      <button class="ghost" id="op">افتحه</button>
    </div>
    ${wa?`<button class="ghost" id="wa" style="width:100%;margin-bottom:10px">إرسال بالواتساب</button>`:""}
    <button class="ghost" id="rv" style="width:100%;margin-bottom:14px">إلغاء الرابط وإصدار واحد جديد</button>
    <button class="primary" id="ok">${p.synced?"تمام":"فعّل الرابط"}</button>`);

  document.getElementById("cp").onclick=async()=>{
    try{await navigator.clipboard.writeText(link);document.getElementById("cp").textContent="انتسخ ✓"}
    catch(e){const t=document.getElementById("lk");t.focus();t.select();
      document.getElementById("cp").textContent="حدّده وانسخه بإيدك"}
  };
  document.getElementById("op").onclick=()=>window.open(link,"_blank","noopener");
  if(wa)document.getElementById("wa").onclick=()=>
    window.open("https://wa.me/"+wa+"?text="+encodeURIComponent(txt),"_blank","noopener");
  document.getElementById("rv").onclick=async()=>{
    if(!confirm("الرابط القديم راح يتوقف نهائياً وأي واحد عنده ما يشوف الحساب. تكمل؟"))return;
    p.pub=randSlug();p.updated=Date.now();p.synced=false;
    await put("parties",p);closeSheet();await doSync(true);shareSheet(pid);
  };
  document.getElementById("ok").onclick=async()=>{
    closeSheet();
    if(!p.synced)await doSync(true);
  };
  if(fresh)queueSync();
}
function pendingCount(){
  let n=0;
  for(const p of parties)if(!p.synced)n++;
  for(const e of entries)if(!e.synced)n++;
  return n;
}
function syncBadge(){
  if(!settings.syncUrl)return `<button class="syncbtn" id="sb" data-act="sync" title="المزامنة">
    <span class="dot"></span><span>مو مربوط</span></button>`;
  const n=pendingCount();
  let cls="ok",txt="متزامن";
  if(syncState==="busy"){cls="busy";txt="يزامن…"}
  else if(syncState==="err"){cls="err";txt="ما زامن"}
  else if(!navigator.onLine){cls="pend";txt=n?n+" بالانتظار":"أوفلاين"}
  else if(n){cls="pend";txt=n+" بالانتظار"}
  return `<button class="syncbtn" id="sb" data-act="sync" title="${esc(syncMsg||"")}">
    <span class="dot ${cls}"></span><span>${txt}</span></button>`;
}
function paintBadge(){
  const old=document.getElementById("sb");
  if(!old)return;
  const box=document.createElement("div");
  box.innerHTML=syncBadge();
  const el=box.firstElementChild;
  old.replaceWith(el);
  el.addEventListener("click",onAct);
}
function toast(msg,ms){
  const l=document.getElementById("layer");
  if(l.querySelector(".sheet-bg"))return;
  const t=document.createElement("div");
  t.className="toast";t.innerHTML=`<div>${esc(msg)}</div>`;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),ms||2600);
}

let syncTimer=null;
function queueSync(){
  if(!settings.syncUrl)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>doSync(false),2500);
  paintBadge();
}

async function api(payload){
  const res=await fetch(settings.syncUrl,{
    method:"POST",
    /* text/plain keeps this a "simple" request so Apps Script never sees a CORS preflight */
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(Object.assign({token:settings.token||""},payload))
  });
  if(!res.ok)throw new Error("HTTP "+res.status);
  const txt=await res.text();
  let out;
  try{out=JSON.parse(txt)}
  catch(e){throw new Error("رد غير مفهوم من الشيت — تأكد إن الرابط هو رابط التطبيق مو رابط المحرر")}
  if(!out.ok)throw new Error(out.error||"رفض الخادم الطلب");
  return out;
}

async function doSync(manual){
  if(!settings.syncUrl){if(manual)toast("ما موجود رابط مزامنة. افتح الإعدادات.");return}
  if(syncState==="busy")return;
  if(!navigator.onLine){syncState="idle";paintBadge();if(manual)toast("ماكو إنترنت. الحركات محفوظة وتنرفع لحالها.");return}
  syncState="busy";syncMsg="";paintBadge();
  try{
    const pushP=parties.filter(p=>!p.synced);
    const pushE=entries.filter(e=>!e.synced);
    const out=await api({op:"sync",since:settings.lastPull||0,parties:pushP,entries:pushE});

    /* 1. mark what the server accepted */
    const okP=new Set(out.savedParties||[]),okE=new Set(out.savedEntries||[]);
    const wrP=[],wrE=[];
    for(const p of pushP)if(okP.has(p.id)){p.synced=true;wrP.push(p)}
    for(const e of pushE)if(okE.has(e.id)){e.synced=true;wrE.push(e)}

    /* 2. merge what came back from the server */
    const pIdx=new Map(parties.map(p=>[p.id,p]));
    for(const rp of out.parties||[]){
      const cur=pIdx.get(rp.id);
      if(!cur){rp.synced=true;parties.push(rp);pIdx.set(rp.id,rp);wrP.push(rp)}
      else if(cur.synced&&(rp.updated||0)>(cur.updated||0)){
        Object.assign(cur,rp);cur.synced=true;wrP.push(cur);
      }
    }
    const eIdx=new Map(entries.map(e=>[e.id,e]));
    let newE=0;
    for(const re of out.entries||[]){
      const cur=eIdx.get(re.id);
      if(!cur){re.synced=true;entries.push(re);eIdx.set(re.id,re);wrE.push(re);newE++}
      else if(re.voided&&!cur.voided){cur.voided=true;cur.synced=true;wrE.push(cur)}
    }
    if(wrP.length)await putMany("parties",wrP);
    if(wrE.length)await putMany("entries",wrE);
    if(newE||((out.parties||[]).length))
      { normalize(); reindex(); }

    settings.lastPull=out.now;
    settings.lastSyncAt=Date.now();
    await saveSettings();
    syncState="ok";syncMsg="";
    const up=wrP.length+wrE.length;
    if(manual)toast(up?`تمت المزامنة — ${pushP.length+pushE.length} مرفوعة، ${newE} واصلة`:"كل شي متزامن");
    render();
  }catch(err){
    syncState="err";syncMsg=String(err.message||err);
    console.error("sync failed",err);
    if(manual)toast("فشلت المزامنة: "+syncMsg,5000);
    paintBadge();
  }
}
window.addEventListener("online",()=>{paintBadge();doSync(false)});
window.addEventListener("offline",paintBadge);

/* ================= service worker ================= */
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(e=>console.warn("sw failed",e));
  });
}

function toggleTheme(){
  const cur=document.documentElement.getAttribute("data-theme");
  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  const next=dark?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem("ledger_theme",next)}catch(e){}
}
try{const t=localStorage.getItem("ledger_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}

loadAll().then(()=>{history.replaceState(navState(),"");render();if(settings.syncUrl)setTimeout(()=>doSync(false),600)}).catch(e=>{
  console.error(e);
  document.getElementById("app").innerHTML=`<div class="empty">ما فتحت قاعدة البيانات.<br>جرّب تفتح الصفحة بنافذة عادية مو خاصة.</div>`;
});
